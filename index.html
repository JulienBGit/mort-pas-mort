<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mort ou Pas Mort ?</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1a1a1a;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #2a2a2a;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border-radius: 10px;
            box-sizing: border-box;
            text-align: center;
            border: 2px solid #444;
        }
        h1 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #ff5555;
            text-transform: uppercase;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            background: #111;
            padding: 8px 12px;
            border-radius: 5px;
        }
        .timer {
            color: #ff5555;
        }
        .photo-box {
            width: 100%;
            height: 300px;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border: 1px solid #444;
        }
        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #55ffcc;
        }
        .actions {
            display: flex;
            gap: 15px;
        }
        .btn {
            flex: 1;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
        }
        .btn-alive {
            background-color: #2e8b57;
        }
        .btn-dead {
            background-color: #b22222;
        }
        .btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
        .category-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-cat {
            background: #333;
            color: #fff;
            padding: 15px;
            font-size: 1.1rem;
            border: 1px solid #555;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-cat:hover {
            background: #444;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .initials-input {
            font-size: 1.5rem;
            width: 45px;
            height: 45px;
            text-align: center;
            text-transform: uppercase;
            background: #111;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
        }
        .highscores {
            margin-top: 15px;
            text-align: left;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
        }
        .highscore-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #333;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ÉCRAN ACCUEIL -->
    <div id="screen-home" class="screen active">
        <h1>💀 MORT OU PAS MORT ? 💀</h1>
        <p style="margin-bottom: 20px; color: #aaa; font-size: 0.9rem;">Choisis ta catégorie (10s par photo, erreur fatale !)</p>
        <div class="category-grid">
            <button class="btn-cat" onclick="startCategory('politique')">🏛️ Politique</button>
            <button class="btn-cat" onclick="startCategory('chanteurs')">🎤 Chanteurs</button>
            <button class="btn-cat" onclick="startCategory('tv')">📺 Médias / TV</button>
            <button class="btn-cat" onclick="startCategory('acteur')">🎬 Acteurs</button>
            <button class="btn-cat" onclick="startCategory('random')">🎲 Aléatoire (Tout)</button>
        </div>
    </div>

    <!-- ÉCRAN DE JEU -->
    <div id="screen-game" class="screen">
        <div class="hud">
            <div id="hud-score">SCORE: 0</div>
            <div id="hud-timer" class="timer">10s</div>
        </div>
        <div class="photo-box">
            <img id="celeb-img" src="" alt="Photo">
        </div>
        <div id="celeb-name" class="name">Chargement...</div>
        <div class="actions">
            <button class="btn btn-alive" onclick="answer(false)">🚫 Pas mort</button>
            <button class="btn btn-dead" onclick="answer(true)">💀 Mort</button>
        </div>
    </div>

    <!-- ÉCRAN GAME OVER -->
    <div id="screen-gameover" class="screen">
        <h1 style="color: #ff5555;">GAME OVER</h1>
        <p id="gameover-reason" style="color: #ff9999; font-weight: bold;"></p>
        <h2 id="final-score" style="color: #55ffcc;">SCORE : 0</h2>

        <div id="score-section" style="margin: 15px 0;">
            <p style="color: #aaa;">Entre tes 5 initiales :</p>
            <div style="display: flex; justify-content: center; gap: 5px;">
                <input type="text" maxlength="1" class="initials-input" id="c1" value="A">
                <input type="text" maxlength="1" class="initials-input" id="c2" value="R">
                <input type="text" maxlength="1" class="initials-input" id="c3" value="C">
                <input type="text" maxlength="1" class="initials-input" id="c4" value="A">
                <input type="text" maxlength="1" class="initials-input" id="c5" value="D">
            </div>
            <button class="btn" style="background: #555; margin-top: 10px; width: 100%;" onclick="saveScore()">Enregistrer</button>
        </div>

        <div class="highscores" id="highscores-list"></div>

        <button class="btn btn-cat" style="margin-top: 15px; text-align: center;" onclick="goHome()">Rejouer</button>
    </div>
</div>

<script>
    const database = {
        politique: [
            "Valéry Giscard d'Estaing", "Jacques Chirac", "Jean-Marie Le Pen", "Joe Biden", 
            "Angela Merkel", "Kofi Annan", "François Hollande", "Nicolas Sarkozy", 
            "Dominique Strauss-Kahn", "Laurent Fabius", "Édouard Balladur", "Alain Juppé"
        ],
        chanteurs: [
            "Johnny Hallyday", "Michel Delpech", "Line Renaud", "Michel Sardou", 
            "Alain Souchon", "Christophe (chanteur)", "Eddy Mitchell", "Serge Gainsbourg", 
            "Charles Aznavour", "Françoise Hardy", "Patrick Juvet"
        ],
        tv: [
            "Jean-Pierre Pernaut", "Michel Drucker", "Patrick Sébastien", "Philippe Gildas", 
            "Thierry Ardisson", "Jean-Luc Delarue", "William Leymergie", "Denise Fabre",
            "Évelyne Dhéliat", "Philippe Risoli", "Patrick Sabatier"
        ],
        acteur: [
            "Jean-Paul Belmondo", "Alain Delon", "Pierre Richard", "Brigitte Bardot", 
            "Claude Brasseur", "Jean Rochefort", "Michel Piccoli", "Gérard Depardieu",
            "Anouk Aimée", "Catherine Deneuve", "Jean-Pierre Marielle"
        ]
    };

    let currentQueue = [];
    let currentPerson = null;
    let score = 0;
    let timer = null;
    let timeLeft = 10;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function startCategory(cat) {
        let names = [];
        if (cat === 'random') {
            names = [].concat(...Object.values(database));
        } else {
            names = database[cat] || [];
        }
        currentQueue = names.sort(() => Math.random() - 0.5);
        score = 0;
        document.getElementById('hud-score').innerText = `SCORE: ${score}`;
        showScreen('screen-game');
        loadNextPerson();
    }

    async function loadNextPerson() {
        clearInterval(timer);
        if (currentQueue.length === 0) {
            currentQueue = [].concat(...Object.values(database)).sort(() => Math.random() - 0.5);
        }

        const name = currentQueue.pop();
        document.getElementById('celeb-name').innerText = "Chargement...";
        document.getElementById('celeb-img').src = "";

        try {
            const res = await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`);
            const data = await res.json();

            if (!data.thumbnail || !data.thumbnail.source) {
                loadNextPerson();
                return;
            }

            const rawImgUrl = data.thumbnail.source;
            const safeImgUrl = `https://images.weserv.nl/?url=${encodeURIComponent(rawImgUrl.replace(/^https?:\/\//, ''))}`;

            const summaryText = data.extract || "";
            const isDead = summaryText.toLowerCase().includes("mort") || 
                           summaryText.toLowerCase().includes("décédé") || 
                           summaryText.toLowerCase().includes("décédée") ||
                           data.description?.toLowerCase().includes("mort") ||
                           name === "Jean-Marie Le Pen" || name === "Valéry Giscard d'Estaing" || 
                           name === "Jacques Chirac" || name === "Johnny Hallyday" || 
                           name === "Michel Delpech" || name === "Christophe (chanteur)" ||
                           name === "Jean-Pierre Pernaut" || name === "Philippe Gildas" ||
                           name === "Jean-Paul Belmondo" || name === "Alain Delon" || 
                           name === "Claude Brasseur" || name === "Kofi Annan" ||
                           name === "Serge Gainsbourg" || name === "Charles Aznavour" ||
                           name === "Françoise Hardy" || name === "Patrick Juvet" ||
                           name === "Jean-Luc Delarue" || name === "Jean Rochefort" ||
                           name === "Michel Piccoli" || name === "Anouk Aimée" ||
                           name === "Jean-Pierre Marielle";

            currentPerson = {
                title: data.title,
                dead: isDead,
                img: safeImgUrl
            };

            document.getElementById('celeb-name').innerText = currentPerson.title;
            document.getElementById('celeb-img').src = currentPerson.img;
            startTimer();

        } catch (e) {
            loadNextPerson();
        }
    }

    function startTimer() {
        timeLeft = 10;
        const timerEl = document.getElementById('hud-timer');
        timerEl.innerText = `${timeLeft}s`;

        timer = setInterval(() => {
            timeLeft--;
            timerEl.innerText = `${timeLeft}s`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                gameOver("Temps écoulé !");
            }
        }, 1000);
    }

        if (

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mort ou Pas Mort ?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #111;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .timer {
            color: #d9534f;
        }
        .photo-box {
            width: 100%;
            height: 320px;
            background: #eee;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .name {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }
        .btn-alive {
            background-color: #5cb85c;
        }
        .btn-dead {
            background-color: #d9534f;
        }
        .btn:active {
            opacity: 0.8;
        }
        .category-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-cat {
            background: #007bff;
            color: white;
            padding: 15px;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-weight: bold;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .initials-input {
            font-size: 1.5rem;
            width: 40px;
            text-align: center;
            text-transform: uppercase;
        }
        .highscores {
            margin-top: 15px;
            text-align: left;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
        }
        .highscore-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ÉCRAN ACCUEIL -->
    <div id="screen-home" class="screen active">
        <h1>💀 MORT OU PAS MORT ? 💀</h1>
        <p style="margin-bottom: 20px; color: #666;">Choisis ta catégorie (10s par photo, erreur fatale !)</p>
        <div class="category-grid">
            <button class="btn-cat" onclick="startCategory('politique')">🏛️ Politique</button>
            <button class="btn-cat" onclick="startCategory('chanteurs')">🎤 Chanteurs</button>
            <button class="btn-cat" onclick="startCategory('tv')">📺 Médias / TV</button>
            <button class="btn-cat" onclick="startCategory('acteur')">🎬 Acteurs</button>
            <button class="btn-cat" onclick="startCategory('random')">🎲 Aléatoire (Tout)</button>
        </div>
    </div>

    <!-- ÉCRAN DE JEU -->
    <div id="screen-game" class="screen">
        <div class="hud">
            <div id="hud-score">SCORE: 0</div>
            <div id="hud-timer" class="timer">10s</div>
        </div>
        <div class="photo-box">
            <img id="celeb-img" src="" alt="Photo">
        </div>
        <div id="celeb-name" class="name">Chargement...</div>
        <div class="actions">
            <button class="btn btn-alive" onclick="answer(false)">🚫 Pas mort</button>
            <button class="btn btn-dead" onclick="answer(true)">💀 Mort</button>
        </div>
    </div>

    <!-- ÉCRAN GAME OVER -->
    <div id="screen-gameover" class="screen">
        <h1>GAME OVER</h1>
        <p id="gameover-reason" style="color: #d9534f; font-weight: bold;"></p>
        <h2 id="final-score">SCORE : 0</h2>

        <div id="score-section" style="margin: 15px 0;">
            <p>Entre tes 5 initiales :</p>
            <div style="display: flex; justify-content: center; gap: 5px;">
                <input type="text" maxlength="1" class="initials-input" id="c1" value="A">
                <input type="text" maxlength="1" class="initials-input" id="c2" value="R">
                <input type="text" maxlength="1" class="initials-input" id="c3" value="C">
                <input type="text" maxlength="1" class="initials-input" id="c4" value="A">
                <input type="text" maxlength="1" class="initials-input" id="c5" value="D">
            </div>
            <button class="btn" style="background: #333; margin-top: 10px; width: 100%;" onclick="saveScore()">Enregistrer le score</button>
        </div>

        <div class="highscores" id="highscores-list"></div>

        <button class="btn btn-cat" style="margin-top: 15px; text-align: center;" onclick="goHome()">Rejouer</button>
    </div>
</div>

<script>
    // Listes de pages Wikipédia cibles par catégorie (titres exacts des articles FR)
    const database = {
        politique: [
            "Valéry Giscard d'Estaing", "Jacques Chirac", "Jean-Marie Le Pen", "Joe Biden", 
            "Angela Merkel", "Kofi Annan", "François Hollande", "Nicolas Sarkozy", 
            "Dominique Strauss-Kahn", "Laurent Fabius", "Édouard Balladur", "Alain Juppé"
        ],
        chanteurs: [
            "Johnny Hallyday", "Michel Delpech", "Line Renaud", "Michel Sardou", 
            "Alain Souchon", "Christophe (chanteur)", "Eddy Mitchell", "Hervé Cristiani",
            "Serge Gainsbourg", "Charles Aznavour", "Françoise Hardy", "Patrick Juvet"
        ],
        tv: [
            "Jean-Pierre Pernaut", "Michel Drucker", "Patrick Sébastien", "Philippe Gildas", 
            "Thierry Ardisson", "Jean-Luc Delarue", "William Leymergie", "Denise Fabre",
            "Évelyne Dhéliat", "Philippe Risoli", "Patrick Sabatier"
        ],
        acteur: [
            "Jean-Paul Belmondo", "Alain Delon", "Pierre Richard", "Brigitte Bardot", 
            "Claude Brasseur", "Jean Rochefort", "Michel Piccoli", "Gérard Depardieu",
            "Anouk Aimée", "Catherine Deneuve", "Jean-Pierre Marielle"
        ]
    };

    let currentQueue = [];
    let currentPerson = null;
    let score = 0;
    let timer = null;
    let timeLeft = 10;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function startCategory(cat) {
        let names = [];
        if (cat === 'random') {
            Object.values(database.politique, database.chanteurs, database.tv, database.acteur).forEach(arr => {});
            names = [].concat(...Object.values(database));
        } else {
            names = database[cat] || [];
        }
        // Mélanger la liste
        currentQueue = names.sort(() => Math.random() - 0.5);
        score = 0;
        document.getElementById('hud-score').innerText = `SCORE: ${score}`;
        showScreen('screen-game');
        loadNextPerson();
    }

    async function loadNextPerson() {
        clearInterval(timer);
        if (currentQueue.length === 0) {
            // Si on a épuisé la liste, on recharge
            currentQueue = [].concat(...Object.values(database)).sort(() => Math.random() - 0.5);
        }

        const name = currentQueue.pop();
        document.getElementById('celeb-name').innerText = "Chargement...";
        document.getElementById('celeb-img').src = "";

        try {
            // Appel direct à l'API résumé Wikipédia
            const res = await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`);
            const data = await res.json();

            // Sécurité : si pas de photo valide, on passe au suivant direct
            if (!data.thumbnail || !data.thumbnail.source) {
                loadNextPerson();
                return;
            }

            // Contournement CORS pour l'affichage de l'image via un proxy d'image public gratuit
            const rawImgUrl = data.thumbnail.source;
            const safeImgUrl = `https://images.weserv.nl/?url=${encodeURIComponent(rawImgUrl.replace(/^https?:\/\//, ''))}`;

            // Détection du décès via l'extrait ou les données textuelles de Wikipédia
            // L'API summary contient parfois "died" ou une date de décès, ou on vérifie si un texte de décès est présent
            const summaryText = data.extract || "";
            const isDead = summaryText.toLowerCase().includes("mort") || 
                           summaryText.toLowerCase().includes("décédé") || 
                           summaryText.toLowerCase().includes("décédée") ||
                           data.description?.toLowerCase().includes("mort") ||
                           // Cas spécifiques connus gérés manuellement si l'API est ambigue
                           name === "Jean-Marie Le Pen" || name === "Valéry Giscard d'Estaing" || 
                           name === "Jacques Chirac" || name === "Johnny Hallyday" || 
                           name === "Michel Delpech" || name === "Christophe (chanteur)" ||
                           name === "Jean-Pierre Pernaut" || name === "Philippe Gildas" ||
                           name === "Jean-Paul Belmondo" || name === "Alain Delon" || 
                           name === "Claude Brasseur" || name === "Kofi Annan";

            currentPerson = {
                title: data.title,
                dead: isDead,
                img: safeImgUrl
            };

            document.getElementById('celeb-name').innerText = currentPerson.title;
            document.getElementById('celeb-img').src = currentPerson.img;
            startTimer();

        } catch (e) {
            // En cas d'erreur réseau, on skip
            loadNextPerson();
        }
    }

    function startTimer() {
        timeLeft = 10;
        const timerEl = document.getElementById('hud-timer');
        timerEl.innerText = `${timeLeft}s`;

        timer = setInterval(() => {
            timeLeft--;
            timerEl.innerText = `${timeLeft}s`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                gameOver("Temps écoulé !");
            }
        }, 1000);
    }

    function answer(playerGuessDead) {
        clearInterval(timer);
        if (playerGuessDead === currentPerson.dead) {
            score += 10 + (timeLeft * 2);
            document.getElementById('hud-score').innerText = `SCORE: ${score}`;
            loadNextPerson();
        } else {
            const status = currentPerson.dead ? "est MORT(E)" : "est EN VIE";
            gameOver(`${currentPerson.title} ${status} !`);
        }
    }

    function gameOver(reason) {
        clearInterval(timer);
        document.getElementById('gameover-reason').innerText = reason;
        document.getElementById('final-score').innerText = `SCORE : ${score}`;
        document.getElementById('score-section').style.display = 'block';
        showScreen('screen-gameover');
        loadHighscores();
    }

    function loadHighscores() {
        let scores = JSON.parse(localStorage.getItem('mort_scores') || '[]');
        scores.sort((a, b) => b.score - a.score);
        
        const list = document.getElementById('highscores-list');
        if (scores.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:#777;">Aucun score</div>';
            return;
        }

        list.innerHTML = '<strong>HALL OF FAME</strong>' + scores.slice(0, 5).map((s, i) => `
            <div class="highscore-row">
                <span>#${i+1} ${s.name}</span>
                <span>${s.score} pts</span>
            </div>
        `).join('');
    }

    function saveScore() {
        const c1 = document.getElementById('c1').value || 'A';
        const c2 = document.getElementById('c2').value || 'R';
        const c3 = document.getElementById('c3').value || 'C';
        const c4 = document.getElementById('c4').value || 'A';
        const c5 = document.getElementById('c5').value || 'D';
        const initials = (c1 + c2 + c3 + c4 + c5).toUpperCase();

        let scores = JSON.parse(localStorage.getItem('mort_scores') || '[]');
        scores.push({ name: initials, score: score });
        scores.sort((a, b) => b.score - a.score);
        localStorage.setItem('mort_scores', JSON.stringify(scores.slice(0, 10)));

        document.getElementById('score-section').style.display = 'none';
        loadHighscores();
    }

    function goHome() {
        showScreen('screen-home');
    }
</script>

</body>
</html>
